<!doctype html>
<!-- SWIMMINGPOOL — design direction: "municipal swimming pool, daylight".
     UX paradigm: single dense data table with lane-block tabs and a side locker (drawer).
     Signature: animated caustic light on the water header + ceramic tile grout as the table surface. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWIMMINGPOOL — pools.trade, filtered</title>
<meta name="description" content="Every launch on pools.trade — filtered, flagged, rap-sheeted. NO DIVING · NO RUNNING.">
<meta property="og:title" content="SWIMMINGPOOL.lol">
<meta property="og:description" content="pools.trade, filtered. Serial-dev rap sheets · wash flags · new pairs.">
<meta property="og:image" content="https://swimmingpool.lol/og.png">
<meta property="og:url" content="https://swimmingpool.lol">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://swimmingpool.lol/og.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --water1:#59c8ee; --water2:#2495cc; --water3:#0f6ea6;
  --tile:#f4fcfe; --tile2:#e8f7fb; --grout:#cbe9f2; --edge:#a5d8e8;
  --ink:#0c3d52; --dim:#5c8ba0; --faint:#8fb8c8;
  --red:#e6483d; --redbg:#fdeceb; --gold:#f4b23a; --goldbg:#fdf4de;
  --green:#0f9d58; --frog:#5cb944;
  --disp:'Lilita One',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--tile2)}
body{font:12.5px/1.5 var(--mono);color:var(--ink);
  background:var(--tile2);
  background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);
  background-size:32px 32px;min-height:100vh}
a{color:var(--water3);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- water header with caustics ---------- */
.water{position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(180deg,var(--water1),var(--water2) 70%,var(--water3));
  border-bottom:6px solid #fff; box-shadow:0 2px 0 var(--edge)}
.caustic,.caustic2{position:absolute;inset:-40%;pointer-events:none;mix-blend-mode:overlay;opacity:.55;
  background:radial-gradient(ellipse 90px 40px at 20% 30%,rgba(255,255,255,.9),transparent 60%),
             radial-gradient(ellipse 140px 55px at 60% 60%,rgba(255,255,255,.7),transparent 60%),
             radial-gradient(ellipse 110px 45px at 85% 25%,rgba(255,255,255,.8),transparent 60%),
             radial-gradient(ellipse 70px 30px at 40% 80%,rgba(255,255,255,.8),transparent 60%);
  background-size:340px 220px;animation:drift1 9s linear infinite}
.caustic2{opacity:.3;background-size:520px 300px;animation:drift2 14s linear infinite reverse}
@keyframes drift1{to{transform:translate(340px,0)}}
@keyframes drift2{to{transform:translate(520px,0)}}
@media (prefers-reduced-motion:reduce){.caustic,.caustic2{animation:none}}
.wrapH{position:relative;padding:20px 20px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-family:var(--disp);font-size:30px;letter-spacing:.02em;text-shadow:0 2px 0 rgba(9,66,96,.35);font-weight:400}
h1 .lol{font-size:15px;opacity:.85;vertical-align:super}
.sub{font-size:11px;opacity:.9}

.spot{position:relative;width:70px;height:46px;flex:none}
.spot .ring{top:auto;bottom:16px}
.spot .bub{bottom:2px}

/* ---------- lane tabs ---------- */
.lanes{display:flex;gap:10px;padding:14px max(20px,calc((100% - 1200px)/2)) 0;flex-wrap:wrap;align-items:flex-end}
.lane{display:flex;align-items:center;gap:9px;background:#fff;border:2px solid var(--edge);border-bottom:none;
  border-radius:12px 12px 0 0;padding:9px 16px 11px;color:var(--dim);box-shadow:inset 0 -3px 0 var(--grout)}
.lane.on{color:var(--ink);border-color:var(--water2);box-shadow:inset 0 -3px 0 var(--water1)}
.search{margin-left:auto;display:flex;align-items:center;padding-bottom:8px}
.search input{background:#fff;border:2px solid var(--edge);border-radius:20px;padding:8px 16px;width:300px;max-width:74vw;
  font:inherit;color:var(--ink);outline:none}
.search input:focus{border-color:var(--water2)}
.search input::placeholder{color:var(--faint)}

/* ---------- filter deck ---------- */
.deck{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px max(20px,calc((100% - 1200px)/2));background:#fff;
  border-top:2px solid var(--water2);border-bottom:2px solid var(--edge)}
.f{display:flex;align-items:center;gap:5px;background:var(--tile);border:1.5px solid var(--edge);border-radius:9px;
  padding:5px 9px;color:var(--dim);font-size:11px}
.f input[type=number]{width:62px;background:none;border:none;color:var(--ink);font:inherit;font-weight:700;outline:none;text-align:right;appearance:textfield;-moz-appearance:textfield}
.f input[type=number]::-webkit-outer-spin-button,.f input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.f input[type=checkbox]{accent-color:var(--water2)}
.f .u{color:var(--faint)}
.reset{color:var(--faint);font-size:11px;padding:4px 8px;border-radius:8px}
.reset:hover{color:var(--red);background:var(--redbg)}

/* ---------- table on tile ---------- */
.wrap{overflow-x:auto;padding:14px 12px 4px}
table{border-collapse:separate;border-spacing:0;width:100%;max-width:1200px;min-width:960px;margin:0 auto;background:#fff;
  border:2px solid var(--edge);border-radius:14px;overflow:hidden}
th{position:sticky;top:0;background:var(--tile);color:var(--dim);font-weight:700;font-size:10px;text-transform:uppercase;
  letter-spacing:.09em;text-align:right;padding:12px 12px;border-bottom:2px solid var(--edge);cursor:pointer;user-select:none;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:16px}
th.on{color:var(--water3)}
td{padding:12px;text-align:right;border-bottom:1px solid var(--grout);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer;background:#fff}
tbody tr:nth-child(even){background:var(--tile)}
tbody tr:hover{background:#e2f4fa}
tbody tr:last-child td{border-bottom:none}
.tk{display:flex;align-items:center;gap:9px;text-align:left;min-width:0;max-width:300px}
.tk>div{min-width:0}
.tk img,.tk .em{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:var(--tile2);border:1.5px solid var(--edge);object-fit:cover}
.tk .em{font-family:var(--disp);font-size:13px;color:var(--ink)}
.tk .sym{font-family:var(--disp);font-size:14px;letter-spacing:.02em;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.pad{flex:none;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}
.pad img{width:16px;height:16px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px var(--edge);background:#fff}
.pad.unk{width:16px;height:16px;border-radius:50%;background:var(--faint);color:#fff;font-size:9px;font-weight:700;
  box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px var(--edge)}
.tk .nm{color:var(--faint);font-size:10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{color:var(--green);font-weight:700} .down{color:var(--red);font-weight:700} .dimc{color:var(--faint)}
.pill{display:inline-block;border-radius:6px;padding:1px 7px;font-weight:700}
.pill.wash{background:var(--redbg);color:var(--red)}
.vx{color:var(--water3);font-weight:700}
.serial{display:inline-block;background:var(--goldbg);color:#b07708;border-radius:6px;padding:0 5px;font-size:10px;font-weight:700;margin-left:4px}
.addr{color:var(--dim);font-size:11px} .addr:hover{color:var(--water3)}
.addr[data-dev]{cursor:pointer;background:var(--tile);border:1.5px solid var(--edge);border-radius:7px;
  padding:3px 8px;display:inline-block;transition:all .12s}
.addr[data-dev]:hover{border-color:var(--water2);color:var(--water3);background:#fff}
.addr[data-dev]::after{content:" \2197";font-size:9px;opacity:.5}
.copy{color:var(--faint);padding:0 4px} .copy:hover{color:var(--water3)}

/* ---------- frog loader ---------- */
.pool{padding:44px 0 56px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--dim)}
.lanebox{position:relative;width:min(460px,84vw);height:76px;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,var(--water1),var(--water2));border:3px solid #fff;box-shadow:0 0 0 2px var(--edge)}
.lanebox .surface{position:absolute;top:12px;left:0;right:0;height:3px;background:rgba(255,255,255,.85);border-radius:2px}
.lanebox .ca{position:absolute;inset:-30%;mix-blend-mode:overlay;opacity:.5;
  background:radial-gradient(ellipse 80px 34px at 30% 40%,rgba(255,255,255,.9),transparent 60%),
             radial-gradient(ellipse 120px 44px at 70% 70%,rgba(255,255,255,.8),transparent 60%);
  background-size:300px 190px;animation:drift1 8s linear infinite}
.ring{position:absolute;top:13px;left:50%;width:20px;height:8px;border:2px solid rgba(255,255,255,.9);border-radius:50%;
  transform:translateX(-50%);animation:ring 4.2s ease-out infinite}
.ring.r2{animation-delay:1.4s}.ring.r3{animation-delay:2.8s}
@keyframes ring{0%{transform:translateX(-50%) scale(.3);opacity:1}100%{transform:translateX(-50%) scale(4);opacity:0}}
.bub{position:absolute;left:50%;bottom:6px;width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);animation:bub 4.2s linear infinite}
.bub.b2{width:5px;height:5px;margin-left:11px;animation-delay:.9s}
.bub.b3{width:4px;height:4px;margin-left:-13px;animation-delay:1.9s}
.bub.b4{width:6px;height:6px;margin-left:20px;animation-delay:3s}
@keyframes bub{0%{transform:translateY(0);opacity:0}12%{opacity:1}
  100%{transform:translateY(-56px) translateX(6px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bub,.ring,.lanebox .ca{animation:none}}
.pool span{font-family:var(--disp);font-size:14px;letter-spacing:.04em}

/* ---------- locker drawer ---------- */
.ovl{position:fixed;inset:0;background:rgba(12,61,82,.35);backdrop-filter:blur(2px);display:none;z-index:9}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:var(--tile);
  background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);
  background-size:32px 32px;border-left:3px solid #fff;box-shadow:-4px 0 0 var(--edge),-20px 0 40px rgba(12,61,82,.25);
  z-index:10;transform:translateX(103%);transition:transform .18s ease;overflow-y:auto;padding:18px}
.drawer.open{transform:none} .ovl.open{display:block}
.card{background:#fff;border:2px solid var(--edge);border-radius:14px;padding:14px;margin-bottom:12px}
.dhead{display:flex;align-items:center;gap:11px}
.dhead img,.dhead .em{width:42px;height:42px;border-radius:11px;background:var(--tile2);border:2px solid var(--edge);
  display:flex;align-items:center;justify-content:center;font-size:24px}
.dhead h2{font-family:var(--disp);font-size:19px;font-weight:400}
.dhead .nm2{color:var(--dim);font-size:11px}
.dhead .x{margin-left:auto;color:var(--dim);font-size:15px;width:30px;height:30px;border-radius:50%;border:2px solid var(--edge);background:#fff}
.dhead .x:hover{color:var(--red);border-color:var(--red)}
.badges{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.badge{font-size:10px;border-radius:7px;padding:3px 9px;font-weight:700;background:var(--tile2);color:var(--dim);border:1px solid var(--edge)}
.badge.hot{background:var(--redbg);color:var(--red);border-color:#f3c1bd}
.badge.ok{background:#e8f7e4;color:var(--green);border-color:#bfe3b6}
.desc{color:var(--dim);font-size:11px;margin-top:9px;white-space:pre-wrap;max-height:88px;overflow:auto}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.kv div{background:var(--tile);border:1.5px solid var(--edge);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:14px;font-family:var(--disp);font-weight:400}
.kv span{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.spark{width:100%;height:150px;background:linear-gradient(180deg,#eaf8fd,#dcf2fa);border:1.5px solid var(--edge);border-radius:10px;margin-top:10px}
.meta{font-size:11px;color:var(--dim);margin-top:10px;word-break:break-all}
.sec{font-family:var(--disp);color:var(--ink);font-size:13px;letter-spacing:.03em;margin:2px 0 8px}
.rap{display:flex;flex-direction:column;gap:6px}
.rap a{display:flex;gap:8px;align-items:center;color:var(--ink);padding:7px 10px;background:var(--tile);
  border:1.5px solid var(--edge);border-radius:10px;font-size:11px}
.rap a:hover{border-color:var(--water2);text-decoration:none}
.rap .st{margin-left:auto;color:var(--dim);font-size:10px}
.alert{color:var(--red);font-size:11px;background:var(--redbg);border:1.5px solid #f3c1bd;border-radius:10px;padding:8px 11px;margin-top:8px;font-weight:700}
.note{color:var(--faint);font-size:10px;margin-top:6px}
footer{padding:16px 20px 26px;color:var(--dim);font-size:10.5px;display:flex;gap:14px;flex-wrap:wrap}
footer .no{font-family:var(--disp);color:var(--red);letter-spacing:.06em}
.ftoggle{display:none}
@media(max-width:640px){
  .search{margin-left:0;width:100%} .search input{width:100%}
  .kv{grid-template-columns:1fr 1fr} h1{font-size:24px}
  /* collapsed filter deck behind toggle */
  .ftoggle{display:block;margin:10px 16px 0;background:#fff;border:2px solid var(--edge);border-radius:20px;
    padding:8px 16px;font:inherit;color:var(--dim);font-weight:700;width:calc(100% - 32px);text-align:left}
  body:not(.fopen) .deck{display:none}
  .deck{border-top:none}
  /* table → cards */
  .wrap{padding:10px 12px 4px;overflow-x:hidden}
  table{min-width:0;display:block;border:none;background:none;overflow:visible}
  thead{display:none}
  tbody{display:flex;flex-direction:column;gap:10px}
  tbody tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 10px;align-items:center;
    background:#fff !important;border:2px solid var(--edge);border-radius:14px;padding:12px}
  tbody tr:hover{background:#fff}
  td{display:block;border:none !important;padding:0;text-align:left;white-space:normal}
  td:first-child{grid-column:1/4;padding-left:0}
  td[data-l]::before{content:attr(data-l);display:block;font-size:9px;color:var(--faint);
    text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  td:nth-last-child(2){grid-column:1/3}   /* x handle */
  td:nth-last-child(1){grid-column:3;text-align:right} /* dev */
  td:nth-last-child(-n+2)::before{display:none}
}
</style>
</head>
<body>

<div class="water">
  <div class="caustic"></div><div class="caustic2"></div>
  <div class="wrapH">
    <div class="spot"><span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span><span class="bub"></span><span class="bub b2"></span><span class="bub b3"></span><span class="bub b4"></span></div>
    <h1>SWIMMINGPOOL<span class="lol">.lol</span></h1>
    <span class="sub">robinhood, every hood</span>
  </div>
</div>

<div class="lanes">
  <button class="lane on" data-tab="new">NEW PAIRS</button>
  <button class="lane" data-tab="top">TOP</button>
  <div class="search"><input id="q" placeholder="CA · dev wallet · @xhandle" spellcheck="false"></div>
</div>

<button class="ftoggle" id="ftoggle">filters ▾</button>
<div class="deck" id="filters">
  <label class="f">mcap ≥ <input type="number" min="0" id="fMc" placeholder="0"> <span class="u">$</span></label>
  <label class="f">age ≤ <input type="number" min="0" id="fAge" placeholder="∞"> <span class="u">h</span></label>
  <label class="f">holders ≥ <input type="number" min="0" id="fHold" placeholder="0"></label>
  <label class="f">vol24 ≥ <input type="number" min="0" id="fVol" placeholder="0"> <span class="u">$</span></label>
  <label class="f"><input type="checkbox" id="fXV"> 𝕏 connected</label>
  <label class="f"><input type="checkbox" id="fSer"> hide serial devs</label>
  <select class="f" id="fPad" style="cursor:pointer"><option value="">all launchpads</option></select>
  <button class="reset" id="reset">drain filters</button>
  </div>

<div class="wrap"><table>
  <thead><tr id="thead"></tr></thead>
  <tbody id="rows"></tbody>
</table></div>

<div class="pool" id="pool">
  <div class="lanebox">
    <div class="ca"></div><div class="surface"></div>
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="bub"></div><div class="bub b2"></div><div class="bub b3"></div><div class="bub b4"></div>
  </div>
  <span id="poolmsg">filling the pool…</span>
</div>

<footer>
  <span class="no">NO DIVING · NO RUNNING</span>
  <span>· nfa · dyor</span>
  <span style="margin-left:auto">built by <a href="https://x.com/isitnuel" target="_blank" rel="noopener">@isitnuel</a></span>
</footer>

<div class="ovl" id="ovl"></div>
<aside class="drawer" id="drawer"></aside>

<script>
'use strict';
/* ================= config ================= */
const API = '/api';
const DEMO = location.protocol === 'file:';
const REFRESH = 30_000;

/* ================= state ================== */
let feed = { launches: [], auctions: [] };
let tab = 'new';
let sort = { k: 'createdAt', d: -1 };

/* ================= utils ================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = a => a ? a.slice(0,6)+'…'+a.slice(-4) : '—';
const usd = n => (n==null||isNaN(n)||n<0.01) ? '<span class=dimc>—</span>' : n>=1e6 ? '$'+(n/1e6).toFixed(2)+'M' : n>=1e3 ? '$'+(n/1e3).toFixed(1)+'K' : '$'+n.toFixed(n<1?4:0);
const pct = n => (n==null||isNaN(n)||Math.abs(n)<0.05) ? '<span class=dimc>—</span>' : `<span class="${n>=0?'up':'down'}">${n>=0?'+':''}${n.toFixed(1)}%</span>`;
const num = n => n==null ? '—' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : String(n);
const ageMs = t => Date.now()-new Date(t).getTime();
const ageStr = t => { if(!t) return '—'; const m=ageMs(t)/6e4; return m<60?m.toFixed(0)+'m':m<1440?(m/60).toFixed(1)+'h':(m/1440).toFixed(1)+'d'; };
const xOf = u => { const m=String(u||'').match(/(?:x|twitter)\.com\/(@?[A-Za-z0-9_]{1,15})/i); return m?m[1].replace('@',''):null; };
const copy = (t,ev) => { ev.stopPropagation(); navigator.clipboard?.writeText(t); };

// map canonical API row (ca/sym/mcapUsd/volUsd/creator/x/…) → fields the UI already uses

function adapt(r){
  if (r && r.ca && r.tokenAddress===undefined){
    r.tokenAddress = r.ca; r.tokenSymbol = r.sym; r.tokenName = r.name;
    r.fdvUsd = r.mcapUsd; r.creatorAddress = r.creator;
    r.xUrl = r.x ? `https://x.com/${r.x}` : null;
    r.holderCount = r.holders; r.websiteUrl = r.website;
    r.buyersLast1h = r.buyers1h ?? r.buyersLast1h ?? null;
    r.poolStats = { volume24hUsd:r.volUsd, liquidityUsd:r.liqUsd, priceChange24hPct:r.change24h, priceChange1hPct:null };
  }
  return r;
}
function derive(l){
  adapt(l);
  const ps = l.poolStats||{};
  l._liq = ps.liquidityUsd ?? null;
  l._vol = ps.volume24hUsd ?? null;
  l._vl  = (l._vol!=null && l._liq>0) ? l._vol/l._liq : null;
  l._hf  = (l.holderCount!=null && l.fdvUsd>0) ? l.holderCount/(l.fdvUsd/1e3) : null;
  l._c1  = ps.priceChange1hPct ?? null;
  l._c24 = ps.priceChange24hPct ?? null;
  return l;
}
function fromAuction(a){
  return derive({ ...a, poolStats:{ volume24hUsd:null, liquidityUsd:a.raisedUsd??null, priceChange1hPct:null, priceChange24hPct:null },
    holderCount:a.holderCount??null, buyersLast1h:a.buyersLast1h??null, _auction:true });
}
function serialMap(list){
  // prefer TRUE totals from the chain index (feed.creatorCounts) so the badge matches the dev page;
  // fall back to counting within this page when the index hasn't populated yet.
  const m = new Map();
  const truth = (feed.creatorCounts && Object.keys(feed.creatorCounts).length) ? feed.creatorCounts : null;
  if (truth){ for (const [k,v] of Object.entries(truth)) m.set(k, v); return m; }
  for (const l of list){ const c=(l.creatorAddress||'').toLowerCase(); if(c) m.set(c,(m.get(c)||0)+1); }
  return m;
}

/* ================= fetch ================== */
async function load(){
  try{
    if (DEMO){ feed = MOCK; }
    else {
      const r = await fetch(API+'/feed');
      if(!r.ok) throw new Error('feed '+r.status);
      const j = await r.json();
      if(!Array.isArray(j.launches)) throw new Error('shape drift: launches');
      feed = j;
    }
    feed.launches.forEach(derive);
    feed._serial = serialMap(feed.launches);
    populatePads();
    if (firstPaint){ firstPaint=false; setTimeout(()=>{ render();
      const u=new URL(location); const ca=u.searchParams.get('ca'), dev=u.searchParams.get('dev');
      if (ca && /^0x[0-9a-fA-F]{40}$/.test(ca)) openToken(ca); else if (dev) openCreator(dev);
    }, Math.max(0, SHOW_MS-(Date.now()-t0))); }
    else render();
  }catch(e){
    $('poolmsg').textContent = `feed error: ${e.message}`;
  }
}

/* ================= filters ================= */
function populatePads(){
  const sel=$('fPad'); if(!sel) return;
  const cur=sel.value;
  const pads=feed.byPad||{};
  const opts=['<option value="">all launchpads</option>'].concat(
    Object.keys(pads).sort((a,b)=>pads[b]-pads[a]).map(p=>`<option value="${esc(p)}">${esc(p)} (${pads[p]})</option>`));
  sel.innerHTML=opts.join(''); sel.value=cur;
}
function passes(l){
  if ($('fPad').value && l.launchpad!==$('fPad').value) return false;
  const v = id => { const el=$(id); let x=parseFloat(el.value); if(isNaN(x)) return null; if(x<0){x=0; el.value='';} return x; };
  const mc=v('fMc'), age=v('fAge'), hold=v('fHold'), vol=v('fVol');
  if (mc!=null && !(l.fdvUsd>=mc)) return false;
  if (age!=null && !(l.createdAt && ageMs(l.createdAt)<=age*36e5)) return false;
  if (hold!=null && !((l.holderCount??0)>=hold)) return false;
  if (vol!=null && !((l._vol??0)>=vol)) return false;
  if ($('fXV').checked && !xOf(l.xUrl)) return false;
  if ($('fSer').checked && (feed._serial.get((l.creatorAddress||'').toLowerCase())||0)>1) return false;
  return true;
}

const COLS = [
  ['token','token'],['fdvUsd','mcap'],['_vol','vol24'],
  ['_c24','24h'],['holderCount','hold'],['buyersLast1h','buy1h'],
  ['x','𝕏'],['creator','dev'],
];
function header(){
  $('thead').innerHTML = COLS.map(([k,t])=>`<th data-k="${k}" class="${sort.k===k?'on':''}">${t}${sort.k===k?(sort.d<0?' ▾':' ▴'):''}</th>`).join('');
  $('thead').querySelectorAll('th').forEach(th=>th.onclick=()=>{ const k=th.dataset.k; sort = sort.k===k?{k,d:-sort.d}:{k,d:-1}; render(); });
}
const sortVal = (l,k) =>
  k==='token'?l.tokenSymbol: k==='x'?(xOf(l.xUrl)||''): k==='creator'?(l.creatorAddress||''):
  k==='ca'?l.tokenAddress: k==='createdAt'?new Date(l.createdAt||0).getTime(): l[k];
function render(){
  header();
  const src = feed.launches.slice();
  let list = src.filter(passes);
  list.sort((a,b)=>{
    let A=sortVal(a,sort.k), B=sortVal(b,sort.k);
    if (typeof A==='string' || typeof B==='string'){ A=String(A??''); B=String(B??''); return A.localeCompare(B)*-sort.d; }
    A=A??-Infinity; B=B??-Infinity; return (B-A)*(sort.d<0?1:-1);
  });

  $('pool').style.display = 'none';
  if (!list.length){ $('rows').innerHTML = `<tr><td colspan="8" class="dimc" style="text-align:center;padding:34px">nothing survives these filters — pool's empty 🐸</td></tr>`; return; }

  $('rows').innerHTML = list.map(l=>{
    const serial = feed._serial?.get((l.creatorAddress||'').toLowerCase())||0;
    const xh = xOf(l.xUrl);
    const fb = `<span class=em style=&quot;background:hsl(${(l.imageHue??200)},65%,85%)&quot;>${esc((l.tokenSymbol||'?').slice(0,2))}</span>`.replace(/&quot;/g,'\'');
    const img = l.imageUrl && /^https:/.test(l.imageUrl) ? `<img src="${esc(l.imageUrl)}" onerror="this.outerHTML=this.dataset.fb" data-fb="${esc(fb)}">` : fb;
    return `<tr data-ca="${esc(l.tokenAddress)}">
      <td><div class=tk>${img}<div><div class=sym>${padLogo(l.launchpad)}${esc((l.tokenSymbol||'').slice(0,24))}${l._auction?' <span class=badge>cca</span>':''}</div><div class=nm>${esc((l.tokenName||'').slice(0,40))} · ${ageStr(l.createdAt)}</div></div></div></td>
      <td data-l="mcap">${usd(l.fdvUsd)}</td>
      <td data-l="vol24">${usd(l._vol)}</td>
      <td data-l="24h">${pct(l._c24)}</td>
      <td data-l="hold">${num(l.holderCount)}</td>
      <td data-l="buy1h">${num(l.buyersLast1h)}</td>
      <td>${xh?`<a href="https://x.com/${esc(xh)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="${l.xVerified?'vx':''}">@${esc(xh)}</a>`:'<span class=dimc>—</span>'}</td>
      <td><span class=addr data-dev="${esc(l.creatorAddress||'')}">${l.creatorEns?esc(l.creatorEns):short(l.creatorAddress)}</span>${serial>1?`<span class=serial title="launches by this wallet in current index">×${serial}</span>`:''}</td>
    </tr>`;
  }).join('');

  $('rows').querySelectorAll('tr').forEach(tr=>tr.onclick=()=>openToken(tr.dataset.ca));
  $('rows').querySelectorAll('.copy').forEach(b=>b.onclick=ev=>copy(b.dataset.cp,ev));
  $('rows').querySelectorAll('[data-dev]').forEach(s=>s.onclick=ev=>{ev.stopPropagation(); openCreator(s.dataset.dev);});
}

function sparkline(cv, series){
  const c = cv.getContext('2d'), W=cv.width=cv.clientWidth*2, H=cv.height=cv.clientHeight*2;
  const ys = series.map(p=>p.clearingPriceUsd).filter(v=>v!=null);
  if (ys.length<2) return;
  const mn=Math.min(...ys), mx=Math.max(...ys), sp=mx-mn||1;
  const pts = ys.map((v,i)=>[i/(ys.length-1)*(W-20)+10, H-12-((v-mn)/sp)*(H-24)]);
  c.beginPath(); c.moveTo(pts[0][0],H); pts.forEach(p=>c.lineTo(p[0],p[1])); c.lineTo(pts.at(-1)[0],H); c.closePath();
  c.fillStyle = ys.at(-1)>=ys[0] ? 'rgba(15,157,88,.14)' : 'rgba(230,72,61,.12)'; c.fill();
  c.beginPath(); c.lineWidth=3; c.lineJoin='round';
  c.strokeStyle = ys.at(-1)>=ys[0] ? '#0f9d58' : '#e6483d';
  pts.forEach((p,i)=> i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
  c.stroke();
}

function setParam(k,val){ const u=new URL(location); ['ca','dev'].forEach(x=>u.searchParams.delete(x)); if(val) u.searchParams.set(k,val); history.replaceState(null,'',u); }
async function openToken(ca){
  setParam('ca',ca);
  const local = feed.launches.find(l=>l.tokenAddress===ca) || feed.auctions.map(fromAuction).find(l=>l.tokenAddress===ca);
  drawer(tokenHTML(local, null));
  if (local?.poolPriceSeries?.length) sparkline($('spark'), local.poolPriceSeries);
  try{
    const extra = local ? `&pad=${encodeURIComponent(local.launchpad||'')}&creator=${local.creatorAddress||''}&x=${xOf(local.xUrl)||''}` : '';
    const j = DEMO ? MOCK_TOKEN(local) : await (await fetch(`${API}/token?ca=${ca}${extra}`)).json();
    if (j.launch) adapt(j.launch);
    if (j.launch){
      // detail endpoint is thinner & names things differently — local row wins on overlap, detail fills gaps
      const merged = local ? { ...j.launch, ...local } : j.launch;
      if (local){
        merged.description = local.description || j.launch.description;
        merged.poolPriceSeries = (local.poolPriceSeries?.length ? local.poolPriceSeries : j.launch.poolPriceSeries) || [];
      }
      drawer(tokenHTML(derive(merged), j.creator));
      loadChart(ca); }
  }catch{}
}

// live chart: pull noxa OHLC, render candles on the drawer canvas
async function loadChart(ca){
  const cv = $('spark'); if(!cv) return;
  try{
    const j = DEMO ? {candles:demoCandles()} : await (await fetch(`${API}/ohlc?ca=${ca}`)).json();
    const c = j.candles||[];
    if (c.length<2){ drawChart(cv, demoCandles(), true); return; }
    drawChart(cv, c, false);
  }catch{ drawChart(cv, demoCandles(), true); }
}
function demoCandles(){ let p=1; return Array.from({length:40},(_,i)=>{const o=p;p=Math.max(.2,p+(Math.random()-.48)*.12);return{t:i,o,h:Math.max(o,p)+.02,l:Math.min(o,p)-.02,c:p};}); }
function drawChart(cv, candles, faded){
  const ctx=cv.getContext('2d'), W=cv.width=cv.clientWidth*2, H=cv.height=cv.clientHeight*2;
  ctx.clearRect(0,0,W,H);
  const lo=Math.min(...candles.map(k=>k.l ?? k.c)), hi=Math.max(...candles.map(k=>k.h ?? k.c)), sp=hi-lo||1;
  const y=v=>H-14-((v-lo)/sp)*(H-28);
  const n=candles.length, cw=(W-20)/n, bw=Math.max(2,Math.min(cw*0.6,14));
  ctx.globalAlpha=faded?0.4:1;
  candles.forEach((k,i)=>{
    const x=10+i*cw+cw/2;
    const up=(k.c>=k.o);
    ctx.strokeStyle=ctx.fillStyle=up?'#0f9d58':'#e6483d';
    ctx.lineWidth=2;
    if(k.h!=null&&k.l!=null){ ctx.beginPath(); ctx.moveTo(x,y(k.h)); ctx.lineTo(x,y(k.l)); ctx.stroke(); }
    const yo=y(k.o), yc=y(k.c), top=Math.min(yo,yc), h=Math.max(2,Math.abs(yc-yo));
    ctx.fillRect(x-bw/2, top, bw, h);
  });
  ctx.globalAlpha=1;
}

    <div class=meta>CA ${esc(l.tokenAddress)} <button class=copy onclick="navigator.clipboard.writeText('${esc(l.tokenAddress)}')">⧉</button><br>
    dev <span class=addr data-dev="1" style="cursor:pointer" onclick="openCreator('${esc(l.creatorAddress||'')}')">${esc(l.creatorAddress||'—')}</span>
    ${xh?` · <a href="https://x.com/${esc(xh)}" target="_blank" rel="noopener">@${esc(xh)}</a>`:''}
    · <a href="${l.launchpad==='noxa'?`https://noxa.io/token/${esc(l.tokenAddress)}`:`https://pools.trade/t/${esc(l.tokenAddress)}`}" target="_blank" rel="noopener">${esc(l.launchpad||'pools.trade')} ↗</a></div>
  </div>
  <div class=card>
    <div class=sec>🧾 creator rap sheet — wallet</div>
    ${rapW===null?`${MINI_POOL}`: rapW.length? `<div class=rap>${rapW.map(r=>rapRow(r)).join('')}</div>`:`<div class=note>first launch from this wallet (in pools.trade index)</div>`}
    ${others.length?`<div class=alert>⚠ same 𝕏 (@${esc(cr.xHandle)}) deployed from ${others.length} other wallet${others.length>1?'s':''}: ${others.map(short).map(esc).join(', ')}</div>`:''}
    ${rapX&&rapX.length?`<div class=sec style="margin-top:12px">same 𝕏 handle — all wallets</div><div class=rap>${rapX.map(r=>rapRow(r)).join('')}</div>`:''}
    <div class=note>x-handle cross-ref covers tokens seen by the swimmingpool index so far</div>
  </div>`;
}
function rapRow(r){
  const ca = r.tokenAddress||r.ca, sym = r.tokenSymbol||r.sym||'?';
  const pad = r.launchpad||r.pad;
  return `<a onclick="openToken('${esc(ca)}');return false" href="#">${pad?padLogo(pad):''}<b>${esc(sym)}</b> <span class=dimc>${esc(r.tokenName||r.name||'')}</span><span class=st>${r.createdAt||r.at?ageStr(r.createdAt||r.at)+' ago':''}${r.fdvUsd?' · '+usd(r.fdvUsd):''}</span></a>`;
}

async function openCreator(q){
  if(!q) return;
  setParam('dev',q);
  drawer(`<div class=card><div class=dhead><h2>dev ${esc(short(q))}</h2><button class=x onclick="closeDrawer()">✕</button></div>${MINI_POOL}</div>`);
  try{
    const j = DEMO ? MOCK_CREATOR(q) : await (await fetch(`${API}/creator?q=${encodeURIComponent(q)}`)).json();
    const L = (j.launches||[]).map(derive);
    drawer(`<div class=card><div class=dhead><h2>${j.mode==='x'?'@'+esc(j.query):'dev '+esc(short(j.query))}</h2><button class=x onclick="closeDrawer()">✕</button></div>
      <div class=badges><span class=badge>${j.total??L.length} launch${(j.total??L.length)===1?'':'es'}</span><span class=badge>${j.mode==='x'?'by 𝕏 handle':'by wallet'}</span></div>
      ${j.mode==='wallet'?`<div class=meta>${esc(j.query)}</div>`:''}</div>
      <div class=card><div class=sec>launches</div>
      ${L.length?`<div class=rap>${L.map(rapRow).join('')}</div>`:'<div class=note>nothing in index</div>'}</div>`);
  }catch(e){ drawer(`<div class=card><div class=dhead><h2>error</h2><button class=x onclick="closeDrawer()">✕</button></div><div class=note>${esc(e.message)}</div></div>`); }
}

document.querySelectorAll('.lanes [data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.lanes [data-tab]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); tab=b.dataset.tab;
  sort = tab==='new'?{k:'createdAt',d:-1}:{k:'fdvUsd',d:-1};
  render();
});
$('filters').addEventListener('input', render);
$('ftoggle').onclick = () => {
  const open = document.body.classList.toggle('fopen');
  $('ftoggle').textContent = open ? 'filters ▴' : 'filters ▾';
};
$('reset').onclick=()=>{ $('filters').querySelectorAll('input').forEach(i=>i.type==='checkbox'?i.checked=false:i.value=''); render(); };
$('q').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const q = $('q').value.trim();
  if(!q) return;
  /^0x[0-9a-fA-F]{40}$/.test(q) ? openToken(q) : openCreator(q.replace(/^@/,''));
});
window.closeDrawer = closeDrawer; window.openToken = openToken; window.openCreator = openCreator;
