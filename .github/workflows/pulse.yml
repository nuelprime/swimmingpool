name: pulse
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    # A slow tick is not a broken build. Endpoints are rate-limited by third parties, so an
    # occasional timeout is expected — it must never mark the run red or spam failure emails.
    continue-on-error: true
    steps:
      - name: chain indexer (tags, holders, dev wallets)
        continue-on-error: true
        run: |
          # `|| true` on every call: curl -f exits non-zero on any HTTP error or timeout, and a
          # single slow response shouldn't fail the job.
          curl -s -m 70 -o /dev/null -w 'indexer: %{http_code} in %{time_total}s\n' \
            "https://swimmingpool.lol/api/indexer-core" || true

      - name: warm the feed cache
        continue-on-error: true
        run: |
          curl -s -m 70 -o /dev/null -w 'feed: %{http_code} in %{time_total}s\n' \
            "https://swimmingpool.lol/api/feed" || true

      - name: always succeed
        run: echo "pulse tick complete"